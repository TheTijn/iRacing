<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06100B">
  <meta name="description" content="Instant greyhound racing — pick your dogs, watch the race, get paid in under a minute.">
  <title>Instant Greyhounds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="preload" href="data/races.json" as="fetch" crossorigin>
</head>
<body>
  <!-- Shared SVG symbols + silk clip path (kept in the render tree, not display:none, so url(#…) refs resolve) -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <clipPath id="silkBody" clipPathUnits="userSpaceOnUse">
        <path d="M12.4 15.2 Q20 12.6 27.6 15.2 L29 35.2 Q20 37.6 11 35.2 Z"/>
      </clipPath>
      <clipPath id="trapRug" clipPathUnits="userSpaceOnUse"><rect x="5" y="5" width="30" height="30" rx="6.5"/></clipPath>
      <linearGradient id="silkShade" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
      </linearGradient>
    </defs>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 13.5V10M10 3h4M18.5 6.5l1.2-1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5.5v13l8.5-6.5z M13 5.5v13l8.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.6A10.8 10.8 0 0112 5.5c6.4 0 10 6.5 10 6.5a17 17 0 01-3.2 4M6.3 6.9C3.6 8.6 2 12 2 12s3.6 6.5 10 6.5c1.6 0 3-.4 4.2-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8.2 8.2 0 00-5.7 2.3L4 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 9v6l5-3z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4h14v9H5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 4h3.5v3H5zm7 0h3.5v3H12zM8.5 7H12v3H8.5zm7 0H19v3h-3.5zM5 10h3.5v3H5zm7 0h3.5v3H12z" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-horse" viewBox="0 0 24 24"><path d="M9.2 21.5c.4-2.6 1.6-4.4 3-5.6l-2.2-.4-2.3 1.9c-.7.6-1.7.5-2.3-.1l-1-1c-.6-.6-.6-1.5-.1-2.1l4.4-5.5c.9-1.1 1.5-2.3 1.9-3.6l.3-1.3c.1-.4.6-.5.9-.2l1.3 1.4 1.1-1.6c.2-.3.7-.3.9.1l.5 1.6c2.8 1.3 4.6 4 4.9 7.2.3 3.4-.5 6.8-1.6 9.2z" fill="currentColor"/><circle cx="11.6" cy="8.6" r=".9" fill="var(--bg)"/></symbol>
    <symbol id="i-dog" viewBox="0 0 24 24"><path d="M1.6 13.2c1.6.2 2.9-.3 4-1.2 1.6-1.4 3.6-2.4 6.1-2.4 1.5 0 2.8.3 4 .2l1.6-1.9c.2-.3.6-.4.9-.3l.6.2.4-.9c.1-.3.5-.3.7-.1l.5.7 2.3.6c.5.1.7.7.4 1.1l-.4.5-2.6.5c-.5 1.6-1.6 2.9-3.2 3.4l2.4 2.9 2.2.6-.3 1.1-3-.4-3-3.2c-1.1.2-2.3.1-3.4-.2l-3.2 2.5 1.2 1.7-.9.6-2.4-2.3 2.6-3.1c-.6-.4-1.1-.9-1.5-1.5-1.3.9-2.9 1.4-4.7 1.2z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </svg>

  <app-root data-phase="loading" data-sport="dogs"></app-root>
</body>
</html>
